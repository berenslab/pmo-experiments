default_install_hook_types: [pre-commit, commit-msg]

repos:
- repo: https://github.com/codespell-project/codespell
  rev: v2.3.0
  hooks:
    - id: codespell
      stages: [commit-msg]
      args: [--write-changes]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: no-commit-to-branch
      stages: [pre-commit]
      args: ["--branch", "main"]
    - id: mixed-line-ending
      stages: [pre-commit]
    - id: trailing-whitespace
      stages: [pre-commit]
    - id: end-of-file-fixer
      stages: [pre-commit]
    - id: check-yaml
      stages: [pre-commit]
    - id: check-added-large-files
      stages: [pre-commit]
    - id: fix-byte-order-marker
      stages: [pre-commit]

- repo: https://github.com/asottile/pyupgrade
  rev: v3.19.0
  hooks:
    - id: pyupgrade
      stages: [pre-commit]

- repo: https://github.com/Yelp/detect-secrets
  # Check for secrets in code (except .env file)
  rev: v1.5.0
  hooks:
    - id: detect-secrets
      stages: [pre-commit]
      args: ['--baseline', '.secrets.baseline']
      exclude: .env


# - repo: https://github.com/jsh9/pydoclint
#   rev: 0.5.9
#   hooks:
#     - id: pydoclint
#      stages: [pre-commit]

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Lint with ruff
  rev: v0.14.5
  hooks:
    # Run the linter.
    - id: ruff-format
      stages: [pre-commit]
    - id: ruff
      stages: [pre-commit]
      args: [--fix, --exit-non-zero-on-fix]
      types_or: [python, pyi]
      require_serial: true
